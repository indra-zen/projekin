name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    env:
      # Placeholder public values so the build can run; no secrets are needed.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  migrations:
    name: Apply migrations to a real Supabase stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Starts Postgres + Auth + Storage locally (Docker) and applies every
      # migration in supabase/migrations from scratch.
      - run: npx supabase start --exclude realtime,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit
      - run: npx supabase db reset
      - run: npx supabase stop --no-backup
        if: always()
